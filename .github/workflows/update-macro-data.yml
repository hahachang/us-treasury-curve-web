name: Update trade and leading indicators

on:
  schedule:
    - cron: "40 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests lxml playwright python-calamine
      - run: playwright install --with-deps chromium
      - run: python .github/scripts/update_macro_data.py
      - name: Commit only when data changed
        run: |
          if git diff --quiet -- data/trade.json data/ndc.json; then
            echo "No update"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trade.json data/ndc.json
          git commit -m "Update trade and leading indicators"
          git push
