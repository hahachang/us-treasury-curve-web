name: Update MOEA export orders

on:
  schedule:
    - cron: "20 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official MOEA data
        run: |
          mkdir -p data
          curl --fail --location --retry 3 \
            https://service.moea.gov.tw/EE520/opendata/b.csv \
            --output data/moea-orders.csv
          curl --fail --location --retry 3 \
            'https://service.moea.gov.tw/EE520/opendata/%E7%B6%93%E6%BF%9F%E9%83%A8%E7%B5%B1%E8%A8%88%E8%99%95_%E5%A4%96%E9%8A%B7%E8%A8%82%E5%96%AE_%E6%8C%89%E5%9C%B0%E5%8D%80%E5%88%86.csv' \
            --output data/moea-order-regions.csv
      - name: Commit only when data changed
        run: |
          if git diff --quiet -- data/moea-orders.csv data/moea-order-regions.csv; then
            echo "No update"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/moea-orders.csv data/moea-order-regions.csv
          git commit -m "Update MOEA export orders"
          git push
